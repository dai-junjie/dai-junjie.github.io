{{- $src := .Destination -}}
{{- if hasPrefix $src "assets/images/" -}}
  {{- $src = printf "/%s" $src -}}
{{- end -}}
{{- $attributes := merge .Attributes (dict "alt" .Text "src" $src "title" .Title "loading" "lazy") -}}
<img
  {{- range $key, $value := $attributes -}}
    {{- if $value -}}
      {{- printf " %s=%q" $key $value | safeHTMLAttr -}}
    {{- end -}}
  {{- end -}}>
