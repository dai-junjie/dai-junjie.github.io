name: Deploy Hugo site to Pages

env:
  HUGO_VERSION: '0.163.3'

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            --output "$RUNNER_TEMP/hugo.tar.gz"
          echo "ec422258f9a4ffc241de8707297e32311cd86fcc9b2813632617ff4d44935d91  $RUNNER_TEMP/hugo.tar.gz" | sha256sum --check --status
          tar --extract --gzip --file "$RUNNER_TEMP/hugo.tar.gz" --directory "$RUNNER_TEMP" hugo

      - name: Generate site
        run: '"$RUNNER_TEMP/hugo" --gc --minify'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
