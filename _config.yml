# ── Site Settings ──
title: "Junjie's Blog"
subtitle: "系统 · 工程 · 研究"
name: "daijunjie"
description: "技术笔记与思考"
url: "https://dai-junjie.github.io"
repository: "dai-junjie/dai-junjie.github.io"
locale: "zh-CN"
permalink: /:title/

# ── Feed ──
atom_feed:
  hide: true

# ── Theme ──
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "default"

# ── Site Author ──
author:
  name: "daijunjie"
  avatar: "/assets/images/avatar.jpg"
  bio: "系统 · 工程 · 研究"
  location: "Hangzhou, China"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/dai-junjie"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:junjiedai@zju.edu.cn"

# ── Defaults ──
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: false
      related: false
      toc: true
      toc_sticky: true
      show_date: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# ── Breadcrumbs ──
breadcrumbs: true

# ── Comments (Giscus) ──
comments:
  provider: "giscus"
  giscus:
    repo_id: ""
    category_name: "Announcements"
    category_id: ""
    discussion_term: "pathname"
    reactions_enabled: "1"
    theme: "light"
    strict: false

# ── Sass ──
sass:
  quiet_deps: true

# ── Reading ──
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# ── Pagination ──
pagination:
  enabled: true
  per_page: 10
  permalink: "/page:num/"
  title: ":title - page :num"
  sort_field: "date"
  sort_reverse: true

# ── Includes ──
include:
  - _pages

# ── Excludes ──
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - scaffolds
  - .gitignore
  - vendor
  - .obsidian

# ── Plugins ──
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate-v2
  - jekyll-sitemap

# ── Archives ──
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
